<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What one click deploys · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Medusa 2.0 on Railway</p>
    <h1>What one click deploys</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="railway-stack-title railway-stack-desc">
      <title id="railway-stack-title">What one click deploys on Railway</title>
      <desc id="railway-stack-desc">Architecture diagram. Shoppers reach a Next.js storefront and the store owner reaches the Medusa backend directly. The storefront calls the backend for the Store API and MeiliSearch for product search. The backend owns Postgres, Redis, MeiliSearch and an S3 bucket, all inside one Railway project, and calls Stripe and Resend outside it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: the Railway project (drawn before arrows and nodes) -->
      <rect x="192" y="144" width="728" height="312" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="216" y="148" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="157" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ONE RAILWAY PROJECT</text>

      <!-- Arrows first, so z-order puts them behind the nodes -->

      <!-- Shopper into the storefront -->
      <line x1="152" y1="212" x2="216" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Store owner over the top, into the backend's admin dashboard -->
      <path d="M 152,68 H 528 Q 536,68 536,76 V 176"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Primary flow: storefront to backend -->
      <line x1="376" y1="212" x2="456" y2="212" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Storefront queries the search index directly -->
      <line x1="272" y1="248" x2="272" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Backend to its four managed services -->
      <path d="M 468,248 V 304 Q 468,312 460,312 H 328 Q 320,312 320,320 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="496" y1="248" x2="496" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="248" x2="600" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 624,248 V 328 Q 624,336 632,336 H 812 Q 820,336 820,344 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Backend out to the third parties. Inner destination takes the higher
           channel so the outer run never crosses the inner riser. -->
      <path d="M 568,176 V 128 Q 568,120 576,120 H 696 Q 704,120 704,112 V 96"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 608,176 V 144 Q 608,136 616,136 H 848 Q 856,136 856,128 V 96"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels: opaque mask, 8px clear of the stroke -->
      <rect x="164" y="192" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="201" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="256" y="48" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="57" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADMIN</text>

      <rect x="384" y="192" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="201" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE API</text>

      <rect x="280" y="288" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="306" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>

      <rect x="370" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="394" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX</text>

      <rect x="504" y="288" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

      <rect x="544" y="308" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS</text>

      <rect x="698" y="316" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="722" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEDIA</text>

      <rect x="584" y="100" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMAIL</text>

      <rect x="784" y="104" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAYMENTS</text>

      <!-- Node: Store owner -->
      <rect x="40" y="40" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="96" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store owner</text>

      <!-- Node: Shopper -->
      <rect x="40" y="184" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="184" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="192" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="201" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="96" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shopper</text>

      <!-- Node: Resend -->
      <rect x="640" y="40" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="40" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="648" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="662" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="704" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resend</text>

      <!-- Node: Stripe -->
      <rect x="792" y="40" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="40" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="800" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="814" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="856" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stripe</text>

      <!-- Node: Storefront -->
      <rect x="216" y="176" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="176" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="224" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="238" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="296" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storefront</text>
      <text x="296" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js 15 · React 19</text>

      <!-- Node: Backend (focal) -->
      <rect x="456" y="176" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="176" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="464" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="478" y="193" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="544" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend</text>
      <text x="544" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Medusa 2.19 · admin /app</text>

      <!-- Node: MeiliSearch -->
      <rect x="216" y="368" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="368" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="224" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="238" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDX</text>
      <text x="292" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MeiliSearch</text>

      <!-- Node: Postgres -->
      <rect x="392" y="368" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="368" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="400" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="414" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="468" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>

      <!-- Node: Redis -->
      <rect x="568" y="368" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="368" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="576" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="590" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUS</text>
      <text x="644" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>

      <!-- Node: S3 bucket -->
      <rect x="744" y="368" width="152" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="368" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="752" y="376" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="766" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBJ</text>
      <text x="820" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S3 bucket</text>

      <!-- Legend strip -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="536" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <rect x="148" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">App</text>

      <rect x="240" y="536" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data</text>

      <rect x="332" y="536" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="352" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Third party</text>

      <rect x="468" y="536" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="488" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Person</text>

      <line x1="568" y1="542" x2="596" y2="542" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="604" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

      <line x1="736" y1="542" x2="764" y2="542" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="772" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>
    </svg>
  </div>
</body>
</html>
